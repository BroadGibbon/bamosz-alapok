name: 🧮 SQL újraszámítás (minden réteg)

# Automatikusan a napi adat-frissítés SIKERES lefutása után; kézzel is indítható.
on:
  workflow_run:
    workflows: ["🕔 Napi adat-frissítés (BAMOSZ + EUR/USD + árfolyam)"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # kézi indításnál mindig fut; automatikusnál csak ha a data-futás sikeres volt
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL kliens telepítése
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Minden számított réteg újraépítése (psql)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f sql/refresh_all.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
