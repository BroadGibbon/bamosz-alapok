name: Kockázatmentes hozam betöltés (ÁKK HUF)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "A feltöltött CSV fájl neve a repóban"
        required: false
        default: "riskfree_akk.csv"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Betöltés
        run: python load_riskfree_akk.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILE: ${{ github.event.inputs.file }}
